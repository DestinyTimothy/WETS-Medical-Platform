<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - WETS</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login.css">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="system-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="3" y="3" width="18" height="7" rx="2" fill="currentColor" opacity="0.9"/>
                        <rect x="3" y="12" width="18" height="4" rx="1.5" fill="currentColor" opacity="0.7"/>
                        <rect x="3" y="18" width="18" height="3" rx="1" fill="currentColor" opacity="0.5"/>
                    </svg>
                </div>
                <h1 class="welcome-title">Welcome Back</h1>
                <p class="welcome-subtitle">Sign in to access the telemedicine portal</p>
            </div>

            <div class="login-form-container">
                <form id="loginForm" class="login-form" novalidate>
                    <div class="form-group">
                        <label for="username" class="form-label">USERNAME</label>
                        <input 
                            type="text" 
                            id="username" 
                            class="form-input" 
                            placeholder="Enter your username"
                            required
                        >
                    </div>

                    <div class="form-group">
                        <label for="password" class="form-label">PASSWORD</label>
                        <input 
                            type="password" 
                            id="password" 
                            class="form-input" 
                            placeholder="Enter your password"
                            required
                        >
                    </div>

                    <button type="submit" class="login-button" id="submitBtn">
                        Login to System
                    </button>

                    <div class="register-link">
                        <a href="register.html">New user? Register here</a>
                    </div>
                </form>
            </div>

        </div>
    </div>

    <div class="bg-decoration bg-decoration-1"></div>
    <div class="bg-decoration bg-decoration-2"></div>

    <script src="login.js"></script>
</body>
</html>
